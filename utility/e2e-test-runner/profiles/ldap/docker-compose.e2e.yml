version: "3.8"

services:
  ldap:
    image: osixia/openldap:1.5.0
    container_name: ldap
    restart: on-failure
    environment:
      LDAP_ORGANISATION: GeoSolutions
      LDAP_DOMAIN: geosolutions.local
      LDAP_ADMIN_PASSWORD: admin
      LDAP_TLS: "false"
    networks:
      - mapstore-network
