version: "3.8"

# E2E overlay adding a local GeoServer, so WMS/WFS interactions are exercised against
# a disposable service instead of a remote one.
#
# The suites only use data this repository owns: the postgres init script creates a
# PostGIS table that seed-geoserver.sh publishes as e2e:e2e_points, covering WMS and
# DB-backed WFS behaviour (attribute table, filters). The GeoServer release sample
# data is therefore not installed.

services:
  postgres:
    volumes:
      - ./utility/e2e-test-runner/profiles/geoserver/02-init-gisdata.sh:/docker-entrypoint-initdb.d/02-init-gisdata.sh:ro

  geoserver:
    image: docker.osgeo.org/geoserver:2.27.2
    container_name: e2e-geoserver
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GEOSERVER_ADMIN_USER: "${GEOSERVER_ADMIN_USER:-admin}"
      GEOSERVER_ADMIN_PASSWORD: "${GEOSERVER_ADMIN_PASSWORD:-geoserver}"
      SKIP_DEMO_DATA: "true"
      CORS_ENABLED: "true"
      # Chart and counter widgets aggregate through WPS (gs:Aggregate), which the base
      # image does not ship.
      INSTALL_EXTENSIONS: "true"
      STABLE_EXTENSIONS: "wps"
    ports:
      - "8082:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/geoserver/web/ || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    networks:
      - mapstore-network

  mapstore:
    volumes:
      - ./utility/e2e-test-runner/profiles/geoserver/localConfig.e2e.geoserver.patch.json:/usr/local/tomcat/datadir/configs/localConfig.json.patch:ro
