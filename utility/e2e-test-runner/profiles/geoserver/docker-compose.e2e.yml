version: "3.8"

services:
  geoserver:
    image: docker.osgeo.org/geoserver:2.27.2
    container_name: geoserver
    restart: on-failure
    environment:
      GEOSERVER_ADMIN_USER: admin
      GEOSERVER_ADMIN_PASSWORD: geoserver
      CORS_ENABLED: "true"
    ports:
      - "8082:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/geoserver/web/ || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    networks:
      - mapstore-network

  mapstore:
    volumes:
      - ./utility/e2e-test-runner/profiles/geoserver/localConfig.e2e.geoserver.patch.json:/mapstore/datadir/configs/localConfig.json.patch:ro
