# Reverse proxy of the E2E stack, published on a host port other than 80.
#
# docker/mapstore.conf forwards Host without the port ($host): behind a port mapping,
# the URLs MapStore builds from it (the printed PDF, for instance) point to the wrong
# port. Here the Host header is forwarded as the browser sent it.
server {
    listen 80;
    server_tokens off;

    location / {
        return 301 /mapstore;
    }

    location /mapstore {
        proxy_pass http://mapstore:8080/mapstore;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
