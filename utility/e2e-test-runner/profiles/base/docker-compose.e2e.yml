version: "3.8"

# Containers are renamed with an e2e- prefix: docker-compose.yml pins fixed names,
# which would otherwise clash with a developer stack started from the same files.

services:
  postgres:
    container_name: e2e-postgres

  mapstore:
    container_name: e2e-mapstore
    environment:
      # Exported by e2e-docker.sh: the administrator created on the empty database
      INITIAL_ADMIN_PASSWORD: "${INITIAL_ADMIN_PASSWORD:?run the stack through e2e-docker.sh}"
    build:
      args:
        MAPSTORE_WEBAPP_SRC: "product/target/mapstore.war"

  proxy:
    container_name: e2e-proxy
    ports:
      - "8081:80"
    volumes:
      - ./utility/e2e-test-runner/profiles/base/nginx.conf:/etc/nginx/conf.d/default.conf:ro
